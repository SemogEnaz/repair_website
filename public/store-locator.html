<!doctype html>
<html lang="en">
  <head>
    <title>iPhone Repair Clayton location</title>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      gmpx-store-locator {
        display: block;
        width: 100%;
        height: 100%;
        --gmpx-color-surface: #0f172a;
        --gmpx-color-on-surface: #f8fafc;
        --gmpx-color-on-surface-variant: #cbd5e1;
        --gmpx-color-primary: #60a5fa;
        --gmpx-color-outline: #334155;
        --gmpx-fixed-panel-width-row-layout: 17em;
        --gmpx-fixed-panel-height-column-layout: 180px;
        --gmpx-font-family-base: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --gmpx-font-family-headings: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --gmpx-font-size-base: 0.875rem;
      }

      [hidden] {
        display: none !important;
      }

      #map-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        margin: 0;
        padding: 24px;
        text-align: center;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <p id="map-status" role="status">Loading map…</p>
    <!-- Google's Quick Builder locator, isolated from the Vue page lifecycle. -->
    <gmpx-api-loader
      key="AIzaSyDkKGpT-lY9j9a6rkgzOTlWbgG1RZSUKVM"
      solution-channel="GMP_QB_locatorplus_v11_c"
    ></gmpx-api-loader>
    <gmpx-store-locator map-id="DEMO_MAP_ID"></gmpx-store-locator>

    <script type="module">
      const configuration = {
        locations: [
          {
            title: 'iPhone Repair Clayton',
            address1: '2 Greenfield Dr',
            address2: 'Clayton VIC 3168, Australia',
            coords: { lat: -37.92340411854378, lng: 145.12863582023775 },
            placeId: 'ChIJRSS_sNdq1moRF7d4ZJJ736g',
          },
        ],
        mapOptions: {
          center: { lat: -37.92340411854378, lng: 145.12863582023775 },
          fullscreenControl: true,
          mapTypeControl: false,
          streetViewControl: false,
          zoom: 16,
          zoomControl: true,
          maxZoom: 17,
          mapId: 'DEMO_MAP_ID',
          gestureHandling: 'cooperative',
        },
        mapsApiKey: document.querySelector('gmpx-api-loader').getAttribute('key'),
        capabilities: {
          input: false,
          autocomplete: false,
          directions: false,
          distanceMatrix: false,
          details: false,
          actions: false,
        },
      }

      const locator = document.querySelector('gmpx-store-locator')
      const status = document.querySelector('#map-status')

      function showMapError() {
        locator.hidden = true
        status.hidden = false
        status.textContent =
          'The map is unavailable. Use the Get directions button above to find us.'
      }

      window.gm_authFailure = showMapError

      try {
        await import('https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.15/index.min.js')
        await customElements.whenDefined('gmpx-store-locator')
        locator.configureFromQuickBuilder(configuration)
        status.hidden = true
      } catch {
        showMapError()
      }
    </script>
  </body>
</html>
